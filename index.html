<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard">

    <!-- ===== GREETING WIDGET ===== -->
    <section id="greeting" class="card greeting-card" aria-label="Greeting and time">
      <p id="greeting-text" class="greeting-text">Good Morning</p>
      <p id="time" class="time-display" aria-live="polite" aria-atomic="true">00:00:00</p>
      <p id="date" class="date-display"></p>
    </section>

    <!-- ===== FOCUS TIMER ===== -->
    <section id="focus-timer" class="card timer-card" aria-label="Focus timer">
      <h2 class="section-title">Focus Timer</h2>
      <p id="timer-display" class="timer-display" aria-live="polite" aria-atomic="true">25:00</p>
      <div class="timer-controls" role="group" aria-label="Timer controls">
        <button id="timer-start" class="btn btn-primary" type="button" aria-label="Start timer">Start</button>
        <button id="timer-stop"  class="btn btn-secondary" type="button" aria-label="Stop timer">Stop</button>
        <button id="timer-reset" class="btn btn-ghost" type="button" aria-label="Reset timer">Reset</button>
      </div>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section id="todo-list" class="card todo-card" aria-label="To-do list">
      <h2 class="section-title">To-Do List</h2>
      <form id="todo-add-form" class="add-form" novalidate aria-label="Add new task">
        <input
          id="todo-input"
          class="text-input"
          type="text"
          placeholder="Add a new task…"
          aria-label="New task description"
          maxlength="200"
          autocomplete="off"
        />
        <button class="btn btn-primary" type="submit" aria-label="Add task">Add</button>
      </form>
      <ul id="todo-list-items" class="todo-items" aria-label="Task list" aria-live="polite">
      </ul>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section id="quick-links" class="card links-card" aria-label="Quick links">
      <h2 class="section-title">Quick Links</h2>
      <div id="quick-links-list" class="links-grid" aria-label="Saved links"></div>
      <form id="link-add-form" class="add-form link-add-form" novalidate aria-label="Add new quick link">
        <input
          id="link-label-input"
          class="text-input"
          type="text"
          placeholder="Label (e.g. GitHub)"
          aria-label="Link label"
          maxlength="50"
          autocomplete="off"
        />
        <input
          id="link-url-input"
          class="text-input"
          type="url"
          placeholder="URL (e.g. https://github.com)"
          aria-label="Link URL"
          maxlength="500"
          autocomplete="off"
        />
        <button class="btn btn-primary" type="submit" aria-label="Add link">Add Link</button>
      </form>
    </section>

  </div>

  <script defer src="js/app.js"></script>
</body>
</html>
